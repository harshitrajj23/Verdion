version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: veridion-postgres
    restart: always
    environment:
      POSTGRES_USER: veridion
      POSTGRES_PASSWORD: veridion_secret_password
      POSTGRES_DB: veridion_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veridion -d veridion_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veridion-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://veridion:veridion_secret_password@db:5432/veridion_db
      - CHAIN_ID=11155111
      - RPC_URL=http://127.0.0.1:8545
      - DEBUG=true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
